<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개인 운동 기록 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex justify-center items-center">

    <!-- 로그인 화면 -->
    <div id="login-container" class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">로그인</h2>
        <input type="text" id="id-input" placeholder="아이디" class="w-full p-3 mb-4 border rounded">
        <input type="password" id="pw-input" placeholder="비밀번호" class="w-full p-3 mb-6 border rounded">
        <button onclick="checkLogin()" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700">로그인</button>
        <p id="error-msg" class="text-red-500 text-sm mt-4 text-center hidden">아이디 또는 비밀번호가 틀렸습니다.</p>
    </div>

    <!-- 메인 대시보드 -->
    <div id="main-container" class="hidden bg-white p-6 rounded-xl shadow-lg w-full max-w-2xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">운동 기록 관리</h1>
            <button onclick="logout()" class="text-sm text-gray-500 hover:underline">로그아웃</button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <label class="flex items-center space-x-2"><input type="checkbox" id="ex-1" class="w-5 h-5" onchange="saveData()"> <span>팔굽혀펴기 50회</span></label>
            <label class="flex items-center space-x-2"><input type="checkbox" id="ex-2" class="w-5 h-5" onchange="saveData()"> <span>계단오르기</span></label>
            <label class="flex items-center space-x-2"><input type="checkbox" id="ex-3" class="w-5 h-5" onchange="saveData()"> <span>러닝 5km</span></label>
            <label class="flex items-center space-x-2"><input type="checkbox" id="ex-4" class="w-5 h-5" onchange="saveData()"> <span>스쿼트 50회</span></label>
        </div>

        <div id="calendar" class="grid grid-cols-7 gap-2 text-center text-sm">
            <!-- 달력 생성 영역 -->
        </div>
    </div>

    <script>
        const AUTH = { id: "user", pass: "userpass" };
        let workoutData = JSON.parse(localStorage.getItem('myWorkoutData')) || {};

        function checkLogin() {
            const id = document.getElementById('id-input').value;
            const pw = document.getElementById('pw-input').value;
            if (id === AUTH.id && pw === AUTH.pass) {
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('main-container').classList.remove('hidden');
                renderCalendar();
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        }

        function logout() {
            location.reload();
        }

        function getTodayKey() {
            return new Date().toISOString().split('T')[0];
        }

        function saveData() {
            const date = getTodayKey();
            workoutData[date] = {
                1: document.getElementById('ex-1').checked,
                2: document.getElementById('ex-2').checked,
                3: document.getElementById('ex-3').checked,
                4: document.getElementById('ex-4').checked
            };
            localStorage.setItem('myWorkoutData', JSON.stringify(workoutData));
            renderCalendar();
        }

        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

            for (let i = 1; i <= daysInMonth; i++) {
                const dateKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const data = workoutData[dateKey] || {1:false, 2:false, 3:false, 4:false};
                const completed = Object.values(data).filter(v => v).length;
                
                const div = document.createElement('div');
                div.className = `p-2 rounded border ${completed === 4 ? 'bg-green-100' : 'bg-gray-50'}`;
                div.innerHTML = `<div class="font-bold">${i}</div><div class="text-[10px]">${completed}/4</div>`;
                calendar.appendChild(div);
            }
        }

        // 초기화 시 오늘 데이터 로드
        const todayData = workoutData[getTodayKey()] || {};
        for(let i=1; i<=4; i++) document.getElementById(`ex-${i}`).checked = !!todayData[i];
    </script>
</body>
</html>
